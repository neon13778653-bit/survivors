<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Precision outer targeting circle -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#ring)" stroke-width="3.2"/>
  <!-- Inner subtle calibration ring -->
  <circle cx="32" cy="32" r="11.5" fill="none" stroke="#7dd3fc" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.65"/>
  <!-- 4 crisp cardinal rangefinder bars -->
  <rect x="30.2" y="5" width="3.6" height="12" rx="1.8" fill="#bae6fd"/>
  <rect x="30.2" y="47" width="3.6" height="12" rx="1.8" fill="#bae6fd"/>
  <rect x="5" y="30.2" width="12" height="3.6" rx="1.8" fill="#bae6fd"/>
  <rect x="47" y="30.2" width="12" height="3.6" rx="1.8" fill="#bae6fd"/>
  <!-- Hot tactical center lock dot -->
  <circle cx="32" cy="32" r="4.5" fill="#f97316"/>
  <circle cx="32" cy="32" r="2" fill="#fef08a"/>
</svg>
