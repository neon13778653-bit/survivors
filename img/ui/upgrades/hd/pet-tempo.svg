<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="dial" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="52%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <!-- Top crown & tactical side pusher -->
  <rect x="26" y="6" width="12" height="4.2" rx="1.6" fill="url(#dial)"/>
  <rect x="30" y="10" width="4" height="4.5" fill="#0284c7"/>
  <rect x="46.5" y="13.5" width="7.5" height="4" rx="1.5" transform="rotate(40 50.2 15.5)" fill="#7dd3fc"/>
  <!-- Main stopwatch bezel -->
  <circle cx="32" cy="36" r="20.5" fill="none" stroke="url(#dial)" stroke-width="4.4"/>
  <!-- High-tempo active quadrant wedge -->
  <path d="M32 36 L32 20 A16 16 0 0 1 46.5 29.2 Z" fill="url(#sweep)"/>
  <!-- Cardinal calibration ticks -->
  <rect x="30.8" y="20" width="2.4" height="4.5" rx="1" fill="#e0f2fe"/>
  <rect x="30.8" y="47.5" width="2.4" height="4.5" rx="1" fill="#7dd3fc" opacity="0.7"/>
  <rect x="16" y="34.8" width="4.5" height="2.4" rx="1" fill="#7dd3fc" opacity="0.7"/>
  <rect x="43.5" y="34.8" width="4.5" height="2.4" rx="1" fill="#7dd3fc" opacity="0.7"/>
  <!-- Crisp tactical pointer hand -->
  <path d="M32 36 L42.5 26.5" stroke="#fef08a" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="32" cy="36" r="3.6" fill="#f8fafc"/>
</svg>
