<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="case" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="tip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="55%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <g transform="rotate(45 32 32)">
    <!-- Bullet warhead tip -->
    <path d="M32 6 C37 12 40 18 40 24 H24 C24 18 27 12 32 6 Z" fill="url(#tip)"/>
    <!-- Casing neck & body -->
    <rect x="23" y="26.5" width="18" height="22" rx="1.5" fill="url(#case)"/>
    <!-- Crisp vertical highlight -->
    <rect x="26" y="28" width="3.2" height="19" rx="1" fill="#ffffff" opacity="0.32"/>
    <!-- Extractor groove & rim -->
    <rect x="25" y="49.5" width="14" height="2.2" fill="#92400e"/>
    <rect x="22" y="52" width="20" height="4.5" rx="1.2" fill="url(#case)"/>
  </g>
  <!-- Sharp tactical impact chevron marks -->
  <path d="M46 10 L54 10 L54 18" fill="none" stroke="#fdba74" stroke-width="2.6" stroke-linecap="square"/>
  <path d="M39 7 L43 11 M53 21 L57 25" stroke="#fb923c" stroke-width="2.4" stroke-linecap="round"/>
</svg>
